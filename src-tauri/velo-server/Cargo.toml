[package]
name = "velo-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Self-hosted web backend for Velo (IMAP/SMTP/OAuth over HTTP + SQL gateway)"
license = "Apache-2.0"

[[bin]]
name = "velo-server"
path = "src/main.rs"

[dependencies]
velo-core = { path = "../velo-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
axum-extra = { version = "0.9", features = ["cookie"] }
time = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
