[package]
name = "velo-report"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local test-reporting kernel: cargo tests + architecture audits → HTML / data/status.json"
license = "Apache-2.0"

[[bin]]
name = "velo-report"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
